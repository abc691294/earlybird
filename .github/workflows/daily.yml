name: Daily Refresh
on:
  schedule:
    - cron: '0 22 * * *'         # 22:00 UTC daily
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
      SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
      SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Maintain fundamentals (top-priority names first, skip the dead, retry transients)
        run: python maintain.py 800
      - name: Pool refresh (screen)
        run: python pool.py
      - name: Inbound (auto-research tickers Claude Trades pushed on price action)
        run: python inbound.py
      - name: Self-validate (remove junk, flag off-brief drift - keeps the engine honest)
        run: python validate.py
      - name: Sector RSS
        run: python sector_news.py
      - name: Ticker news
        run: python news_scrape.py
      - name: Supply-chain discovery (weekly self-gated; proposes supplier->customer links from news)
        run: python supply_discover.py
        continue-on-error: true      # non-critical: a crash here (e.g. missing dep, API outage)
                                     # must NOT abort move_scan/stock_pumps/watch_alert below it
      - name: Move detector
        run: python move_scan.py
      # Stock pumps scan DISABLED 05/08/2026 (user: pump alerts never accurate or relevant).
      # Code + tbl_eb_pump_news left intact; re-add this step to restore.
      #   - name: Stock pumps scan (Trump + Huang + hyperscaler CEOs + Altman + Su)
      #     run: python stock_pumps.py
      - name: Theme radar (find emerging themes we have no keyword for yet)
        run: python theme_radar.py
      - name: Engine-room digest (log only, no email)
        run: python suggest.py
      - name: Trail pullback floors (ratchet PRICE_BELOW up as a held leader climbs)
        run: python trail_pullback.py
      - name: Watchlist buying-moment alert (emails only when a watched name triggers)
        run: python watch_alert.py
